    <!-- Google tag (gtag.js) — deferred so it never blocks first paint -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      function loadGtag(){
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PEVFZLT56S';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-PEVFZLT56S');
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtag, { timeout: 4000 });
      } else {
        window.addEventListener('load', function(){ setTimeout(loadGtag, 1500); });
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6B35" />
