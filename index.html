<!doctype html>
<html lang="en">

    <!-- Google tag (gtag.js) — loads after page load + delay so it never
         blocks first paint or counts toward Total Blocking Time -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var __gtagLoaded = false;
      function loadGtag(){
        if (__gtagLoaded) return;
        __gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PEVFZLT56S';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-PEVFZLT56S');
      }
      window.addEventListener('load', function(){ setTimeout(loadGtag, 3000); });
      setTimeout(loadGtag, 9000); // safety net if load is delayed
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6B35" />
    
    <!-- Primary Meta Tags -->
    <link rel="canonical" href="https://wkquiz.com/" />
    <title>WKQuiz.com — Learn • Play • Grow | Test Your Knowledge</title>

    <meta property="twitter:description" content="Fun, educational quizzes to help you learn, remember, and grow. Multiple modes, detailed explanations, and progress tracking." />
    <meta property="twitter:image" content="https://wkquiz.com/favicon.svg" />
