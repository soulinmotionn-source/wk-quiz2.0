<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint (prevents a light/dark flash)
      (function () {
        try {
          var t = localStorage.getItem('wkquiz_theme');
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-adsense-account" content="ca-pub-5942011796142096" />
    
    <!-- Google tag (gtag.js) — loads after page load + delay so it never
         blocks first paint or counts toward Total Blocking Time -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var __gtagLoaded = false;
      function loadGtag(){
        if (__gtagLoaded) return;
        __gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PEVFZLT56S';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-PEVFZLT56S');
      }
      // Analytics only loads after the visitor accepts cookies (see ConsentBanner)
      window.wkLoadAnalytics = loadGtag;
      try {
        if (localStorage.getItem('wkquiz_consent') === 'granted') {
          window.addEventListener('load', function(){ setTimeout(loadGtag, 3000); });
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6B35" />
    
    <title>WKQuiz.com — Learn • Play • Grow | Test Your Knowledge</title>
    <!--app-head-->

    <!-- Fonts: Inter (self-hosted, preloaded — no third-party font requests) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
