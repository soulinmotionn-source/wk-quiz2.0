<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1B1740; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="s1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2-reveal" data-composition-id="s2-reveal" data-composition-src="compositions/s2-reveal.html" data-start="5" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3-speed" data-composition-id="s3-speed" data-composition-src="compositions/s3-speed.html" data-start="8" data-duration="7" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4-result" data-composition-id="s4-result" data-composition-src="compositions/s4-result.html" data-start="15" data-duration="5" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5-challenge" data-composition-id="s5-challenge" data-composition-src="compositions/s5-challenge.html" data-start="20" data-duration="5" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6-cta" data-composition-id="s6-cta" data-composition-src="compositions/s6-cta.html" data-start="25" data-duration="5" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
